services:
  - type: web
    runtime: node
    name: watch-hr-backend
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: PORT
        value: 10000
    autoDeploy: true

  - type: static
    name: map-task-frontend
    rootDir: map-task-frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    routes:
      - type: rewrite
        source: "/*"
        destination: /index.html
